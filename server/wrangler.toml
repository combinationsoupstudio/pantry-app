# Local development and the template the deploy script writes from
# (system/pantry-sync-worker/deploy-pantry-sync.js adds the studio account).
name = "pantry-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "HOUSEHOLD"
class_name = "Household"

[[durable_objects.bindings]]
name = "CATALOGUE"
class_name = "Catalogue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Household"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Catalogue"]
